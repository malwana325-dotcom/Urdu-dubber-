name: Build APK
on:
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK with WebView
        run: |
          mkdir -p app/src/main/java/com/urdudubber/app
          echo "plugins { id 'com.android.application' }
          android {
            namespace 'com.urdudubber.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.urdudubber.app'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }" > app/build.gradle
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.2.1' apply false }
          " > build.gradle
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'MANI'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Urdu Dubber" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          MANI
          cat > app/src/main/java/com/urdudubber/app/MainActivity.java << 'JAVA'
          package com.urdudubber.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            public void onCreate(Bundle b){
              super.onCreate(b);
              WebView w = new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.getSettings().setDomStorageEnabled(true);
              w.setWebViewClient(new WebViewClient());
              w.loadUrl("https://malwana325-dotcom.github.io/Urdu-dubber-/");
              setContentView(w);
            }
          }
          JAVA
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Urdu-Dubber-APK
          path: app/build/outputs/apk/debug/*.apk
