name: Build APK
on:
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Init TWA Project
        run: |
          mkdir twa && cd twa
          bubblewrap init --manifest https://malwana325-dotcom.github.io/Urdu-dubber-/manifest.json --directory . --manifestUrl https://malwana325-dotcom.github.io/Urdu-dubber-/manifest.json || echo "init done"
      - name: Build APK
        run: |
          cd twa
          bubblewrap build || echo "build attempted"
      - uses: actions/upload-artifact@v4
        with:
          name: Urdu-Dubber-APK
          path: twa/app-release-signed.apk
